<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="form-container">
        <h1>Formulir Pendaftaran Workshop</h1>
        <p class="subtitle">Silakan isi formulir registrasi workshop di bawah ini dengan data yang valid.</p>
        
        <form action="" method="post" enctype="multipart/form-data">
            
            <!-- Tabel 1: Data Peserta -->
            <h3 class="section-title">Data Peserta</h3>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;"><label for="nama"><strong>Nama Lengkap</strong></label></td>
                    <td><input type="text" id="nama" name="nama" size="30" placeholder="Masukkan nama lengkap" required="required" /></td>
                </tr>
                <tr>
                    <td style="width:32%;"><label for="nim"><strong>NIM</strong></label></td>
                    <td><input type="text" id="nim" name="nim" size="30" placeholder="Contoh: 250713658" required="required" /></td>
                </tr>
                <tr>
                    <td style="width:32%;"><strong>Jenis Kelamin</strong></td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="laki" name="jk" value="Laki-laki" />
                            <label for="laki">Laki-laki</label>
                            <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                            <label for="perempuan">Perempuan</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;"><label for="prodi"><strong>Program Studi</strong></label></td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
            </table>

            <!-- Tabel 2: Pilihan Workshop -->
            <h3 class="section-title">Pilihan Workshop</h3>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;"><strong>Jenis Peserta</strong></td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="mahasiswa" name="jenis_peserta" value="Mahasiswa" />
                            <label for="mahasiswa">Mahasiswa</label>
                            <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                            <label for="umum">Umum</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%; vertical-align: top;"><strong>Materi Workshop</strong></td>
                    <td>
                        <div class="checkbox-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <div><input type="checkbox" id="uiux" name="materi" value="UI/UX Design" /> <label for="uiux">UI/UX Design</label></div>
                            <div><input type="checkbox" id="webdev" name="materi" value="Web Development" /> <label for="webdev">Web Development</label></div>
                            <div><input type="checkbox" id="dataanalysis" name="materi" value="Data Analysis" /> <label for="dataanalysis">Data Analysis</label></div>
                        </div>
                    </td>
                </tr>
            </table>

            <!-- Tabel 3: Informasi Tambahan -->
            <h3 class="section-title">Informasi Tambahan</h3>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%; vertical-align: top;"><label for="alasan"><strong>Alasan Mengikuti Workshop</strong></label></td>
                    <td><textarea id="alasan" name="alasan" rows="4" cols="30" placeholder="Tuliskan alasan atau motivasi Anda..."></textarea></td>
                </tr>
                <tr>
                    <td style="width:32%;"><strong>Jenis Pembayaran</strong></td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                            <label for="qris">QRIS</label>
                            <input type="radio" id="transfer" name="pembayaran" value="Transfer Bank" />
                            <label for="transfer">Transfer Bank</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;"><label for="bukti"><strong>Bukti Pembayaran</strong></label></td>
                    <td><input type="file" id="bukti" name="bukti" accept="image/*,application/pdf" /></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center; padding-top: 15px;">
                        <input type="submit" name="daftar" value="Daftar" class="btn-submit" />
                    </td>
                </tr>
            </table>

        </form>
    </div>
</body>
</html>
