<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Organisasi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="form-container">
        <h1>Formulir Pendaftaran Anggota Organisasi</h1>
        <p class="subtitle">Lengkapi formulir di bawah ini dengan data diri Anda yang valid untuk bergabung bersama kami.</p>
        
        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="0" cellpadding="0" style="width:100%;">
                <tr>
                    <td><label for="nama"><strong>Nama Lengkap</strong></label></td>
                    <td><input type="text" id="nama" name="nama" size="30" placeholder="Masukkan nama lengkap" required="required" /></td>
                </tr>
                <tr>
                    <td><label for="nim"><strong>NIM / NPM</strong></label></td>
                    <td><input type="text" id="nim" name="nim" size="30" placeholder="Contoh: 250713658" required="required" /></td>
                </tr>
                <tr>
                    <td><label for="prodi"><strong>Program Studi</strong></label></td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="email"><strong>Alamat Email</strong></label></td>
                    <td><input type="text" id="email" name="email" size="30" placeholder="nama@student.uajy.ac.id" required="required" /></td>
                </tr>
                <tr>
                    <td><label for="telepon"><strong>Nomor Telepon</strong></label></td>
                    <td><input type="text" id="telepon" name="telepon" size="30" placeholder="08xxxxxxxxxx" required="required" /></td>
                </tr>
                <tr>
                    <td><strong>Jenis Kelamin</strong></td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                            <label for="laki">Laki-Laki</label>
                            <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                            <label for="perempuan">Perempuan</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="semester"><strong>Semester Saat Ini</strong></label></td>
                    <td>
                        <select id="semester" name="semester">
                            <option>Semester 1</option>
                            <option>Semester 2</option>
                            <option>Semester 3</option>
                            <option>Semester 4</option>
                            <option>Semester 5</option>
                            <option>Semester 6</option>
                            <option>Semester 7</option>
                            <option>Semester 8</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><strong>Divisi Pilihan</strong></td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="acara" name="divisi" value="Acara" />
                            <label for="acara">Acara</label>
                            <input type="radio" id="sdm" name="divisi" value="SDM" />
                            <label for="sdm">SDM</label>
                            <input type="radio" id="humas" name="divisi" value="Humas" />
                            <label for="humas">Humas</label>
                            <input type="radio" id="media" name="divisi" value="Media" />
                            <label for="media">Media</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;"><strong>Riwayat Pengalaman &amp; Keahlian</strong></td>
                    <td>
                        <div class="checkbox-section">
                            <strong>Kegiatan yang Pernah Diikuti:</strong><br />
                            <div class="checkbox-group">
                                <input type="checkbox" id="kepanitiaan" name="pengalaman" value="Kepanitiaan" />
                                <label for="kepanitiaan">Kepanitiaan</label>
                                <input type="checkbox" id="organisasi" name="pengalaman" value="Organisasi" />
                                <label for="organisasi">Organisasi</label>
                                <input type="checkbox" id="volunteer" name="pengalaman" value="Volunteer" />
                                <label for="volunteer">Volunteer</label>
                            </div>
                        </div>
                        <div class="checkbox-section" style="margin-top: 10px;">
                            <strong>Keahlian Utama:</strong><br />
                            <div class="checkbox-group">
                                <input type="checkbox" id="publicspeaking" name="kemampuan" value="Public Speaking" />
                                <label for="publicspeaking">Public Speaking</label>
                                <input type="checkbox" id="desain" name="kemampuan" value="Desain" />
                                <label for="desain">Desain</label>
                                <input type="checkbox" id="fotografi" name="kemampuan" value="Fotografi" />
                                <label for="fotografi">Fotografi</label>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;"><label for="alasan"><strong>Motivasi Bergabung</strong></label></td>
                    <td><textarea id="alasan" name="alasan" rows="5" cols="30" placeholder="Tuliskan alasan dan motivasi Anda secara singkat..."></textarea></td>
                </tr>
                <tr>
                    <td><label for="cv"><strong>Unggah Berkas CV</strong></label></td>
                    <td><input type="file" id="cv" name="cv" accept="application/pdf" /></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="daftar" value="Kirim Pendaftaran" class="btn-submit" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
